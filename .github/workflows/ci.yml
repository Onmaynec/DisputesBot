name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: disputesbot_test
          POSTGRES_USER: disputesbot
          POSTGRES_PASSWORD: disputesbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U disputesbot -d disputesbot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+asyncpg://disputesbot:disputesbot@localhost:5432/disputesbot_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q bot tests migrations
      - name: Migrations
        run: alembic upgrade head
      - name: Tests
        run: pytest -q
