name: Verify v0.10 Release

on:
  pull_request:
    paths:
      - ".github/workflows/verify-v010-release.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.10.0" > release.json
          jq -e '
            .tag_name == "v0.10.0" and
            .draft == false and
            .prerelease == false
          ' release.json
          jq -r '.assets[].name' release.json | tee assets.txt
          grep -Fx 'disputes_bot-0.10.0-py3-none-any.whl' assets.txt
          grep -Fx 'disputes_bot-0.10.0.tar.gz' assets.txt
          echo "Release URL: $(jq -r '.html_url' release.json)"
