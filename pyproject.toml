[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "disputes-bot"
version = "0.6.0"
description = "Telegram debate trainer with moderated human PvP and seasonal Elo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Onmaynec" }]
dependencies = [
    "aiogram==3.30.0",
    "openai==2.46.0",
    "pydantic-settings==2.14.2",
    "redis==8.0.1",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "aiosqlite==0.22.1",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
